[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claudegate"
version = "1.0.0"
description = "High-performance bridge proxy connecting Claude Code CLI & Anthropic SDK to any OpenAI-compatible LLM provider."
readme = "README.md"
authors = [
    { name = "ClaudeGate Contributors" }
]
license = { text = "MIT" }
keywords = ["claude", "claude-code", "anthropic", "openai", "openrouter", "groq", "ollama", "proxy", "llm-gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "openai>=1.60.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "build",
]

[project.scripts]
claudegate = "src.cli:cli_main"

[project.urls]
Homepage = "https://github.com/Santosh-Prasad-Verma/ClaudeGate"
Documentation = "https://github.com/Santosh-Prasad-Verma/ClaudeGate#readme"
Repository = "https://github.com/Santosh-Prasad-Verma/ClaudeGate.git"
Issues = "https://github.com/Santosh-Prasad-Verma/ClaudeGate/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
