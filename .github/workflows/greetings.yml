name: Greetings

on:
  pull_request:
    types: [ opened ]
  issues:
    types: [ opened ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  greeting:
    name: Welcome Comment
    runs-on: ubuntu-latest
    steps:
      - name: Greet Contributor
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isPR = !!context.payload.pull_request;
            const isIssue = !!context.payload.issue;
            const actor = context.actor;
            const issueNumber = context.payload.pull_request?.number || context.payload.issue?.number || context.issue?.number;

            if (!issueNumber) {
              console.log("No issue or PR number found in payload. Skipping.");
              return;
            }

            let body = "";
            if (isPR) {
              body = `🎉 Thank you @${actor} for opening this Pull Request to **ClaudeGate**!

### 📋 Pull Request Checklist:
- [ ] Automated CI matrix tests pass (\`pytest\`)
- [ ] Security scans pass (Bandit SAST, CodeQL, Trivy)
- [ ] Code follows [Contributing Guidelines](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md)

Our team will review your changes shortly. Thank you for contributing! 🚀`;
            } else if (isIssue) {
              body = `👋 Welcome @${actor}! Thank you for opening an issue in **ClaudeGate**.

Please ensure you have provided:
- A clear description of the issue or feature request
- Steps to reproduce (if a bug report)
- Your environment configuration (excluding secret API keys)

We appreciate your feedback and will look into this soon! ✨`;
            }

            if (body) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body
              });
            }
